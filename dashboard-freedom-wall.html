<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FF6B9D">
  <title>Freedom Wall | SKalinga Admin</title>
  <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/admin-theme.css">
  <link rel="stylesheet" href="assets/css/loader.css?v=3">
  <style>
    .freedom-toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px}
    .freedom-toolbar .filter-select{min-width:145px}.freedom-search{min-width:220px;flex:1}
    .freedom-button{border:0;border-radius:10px;padding:11px 16px;font:600 14px 'IBM Plex Sans',sans-serif;cursor:pointer}
    .freedom-button.primary{background:var(--pink);color:#fff}.freedom-button.approve{background:#228b57;color:#fff}
    .freedom-button.reject{background:#ffedf3;color:#b42345}.freedom-button.hide{background:#e8f4fc;color:#246487}
    .freedom-button:disabled{opacity:.55;cursor:not-allowed}.freedom-list{display:grid;gap:16px}
    .freedom-post{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:0 4px 16px rgba(27,34,51,.04)}
    .freedom-post-header,.freedom-post-meta,.freedom-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
    .freedom-post-header{justify-content:space-between}.freedom-post h3{margin:14px 0 8px;color:var(--ink);font-size:20px;overflow-wrap:anywhere}
    .freedom-tag,.freedom-status{display:inline-flex;align-items:center;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}
    .freedom-tag{background:#fceaf1;color:#a33b62}.freedom-tag.attention{background:#fff0d1;color:#8a5a00}
    .freedom-status{text-transform:capitalize}.freedom-status.pending{background:#fff0d1;color:#8a5a00}.freedom-status.approved{background:#ddf4e7;color:#17653f}.freedom-status.rejected{background:#fde7eb;color:#a52e54}.freedom-status.hidden{background:#eef2f7;color:#64748b}
    .freedom-post-meta,.freedom-date{color:var(--ink-3);font-size:13px}.freedom-body{margin:16px 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;color:var(--ink-2)}
    .freedom-reason{width:100%;margin-top:12px;min-height:68px;resize:vertical}.freedom-actions{margin-top:12px}
    .freedom-empty{padding:34px;text-align:center;color:var(--ink-3);background:#fff;border:1px dashed var(--line);border-radius:var(--r)}
    @media(max-width:640px){.freedom-toolbar>*{width:100%}.freedom-search{min-width:0}}
  </style>
</head>
<body class="is-loading">
  <div class="app-container">
    <aside class="sidebar" id="adminSidebar"></aside>
    <main class="main-content">
      <header class="top-header">
        <div class="header-left"><h2>Freedom Wall</h2><p id="dashboard-datetime">Loading date and time...</p></div>
        <div class="header-right"><div class="user-profile-card">
          <div class="user-avatar-new" id="userAvatarInitials">--</div>
          <div class="user-details"><h4 id="userFullName">Loading...</h4><span class="user-role-badge" id="userRole">Administrator</span></div>
        </div></div>
      </header>
      <div class="dashboard-content">
        <div class="freedom-toolbar" aria-label="Freedom Wall filters">
          <select id="status-filter" class="filter-select" aria-label="Filter by status">
            <option value="all">All Status</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option>
          </select>
          <select id="category-filter" class="filter-select" aria-label="Filter by category">
            <option value="all">All Categories</option><option>Feedback</option><option>Suggestion</option><option>Concern</option><option>Other</option>
          </select>
          <input id="search-filter" class="search-input freedom-search" type="search" maxlength="120" placeholder="Search title or message" aria-label="Search title or message">
          <button id="refresh-button" class="freedom-button primary" type="button"><i class="fas fa-rotate"></i> Refresh</button>
        </div>
        <div id="posts" class="freedom-list" aria-live="polite"></div>
      </div>
    </main>
  </div>
  <div id="toastContainer"></div>
  <script src="js/auth-guard.js" data-roles="admin,sk_official"></script>
  <script src="assets/js/loader.js?v=3"></script>
  <script src="js/admin-common.js"></script>
  <script src="js/admin-sidebar.js"></script>
  <script>
    (() => {
      const posts=document.getElementById('posts'),statusFilter=document.getElementById('status-filter'),categoryFilter=document.getElementById('category-filter'),searchFilter=document.getElementById('search-filter'),refreshButton=document.getElementById('refresh-button');
      let csrfToken='',searchTimer;
      const element=(tag,className,text)=>{const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node};
      async function request(url,options={}){const response=await fetch(url,{credentials:'same-origin',...options});const data=await response.json();if(!response.ok||!data.success)throw new Error(data.message||'The request could not be completed.');return data}
      function updateDateTime(){const now=new Date();document.getElementById('dashboard-datetime').textContent=`${now.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})} • ${now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`}
      async function loadProfile(){try{const result=await request('api/get_user_profile.php');document.getElementById('userAvatarInitials').textContent=result.user.initials;document.getElementById('userFullName').textContent=result.user.name;document.getElementById('userRole').textContent=result.user.role}catch(error){console.error('Unable to load admin profile:',error)}}
      function actionButton(label,className,callback){const button=element('button',`freedom-button ${className}`,label);button.type='button';button.addEventListener('click',callback);return button}
      function renderPost(post){
        const card=element('article','freedom-post'),header=element('div','freedom-post-header'),tags=element('div','freedom-post-meta');
        tags.append(element('span','freedom-tag',post.category));if(post.needs_attention)tags.append(element('span','freedom-tag attention',`Needs attention: ${post.attention_flags.join(', ')}`));
        header.append(tags,element('span',`freedom-status ${post.is_hidden?'hidden':post.status}`,post.is_hidden?'Hidden':post.status));card.append(header,element('h3','',post.title));
        const author=[post.firstname,post.lastname].filter(Boolean).join(' ')||'Youth member',contact=[post.voter_id?`Voter ID: ${post.voter_id}`:'',post.phone?`Mobile: ${post.phone}`:''].filter(Boolean).join(' · ')||'No voter ID or mobile on file';
        card.append(element('div','freedom-post-meta',`${author} · ${contact}`),element('p','freedom-body',post.body),element('div','freedom-date',`Submitted ${new Date(post.created_at).toLocaleString()}`));
        if(post.rejection_reason)card.append(element('div','freedom-date',`Moderation reason: ${post.rejection_reason}`));
        const reason=element('textarea','freedom-reason');reason.maxLength=2000;reason.placeholder=post.status==='pending'?'Optional rejection reason':'Optional reason';reason.setAttribute('aria-label','Moderation reason');
        const actions=element('div','freedom-actions');
        if(post.status==='pending'){actions.append(actionButton('Approve','approve',()=>moderate(post.id,'approve','')),actionButton('Reject','reject',()=>moderate(post.id,'reject',reason.value)));card.append(reason,actions)}
        else if(post.status==='approved'){const action=post.is_hidden?'unhide':'hide';actions.append(actionButton(post.is_hidden?'Unhide':'Hide from public board',post.is_hidden?'approve':'hide',()=>moderate(post.id,action,reason.value)));card.append(reason,actions)}
        posts.append(card);
      }
      async function loadPosts(){posts.replaceChildren(element('p','freedom-empty','Loading submissions...'));const params=new URLSearchParams({status:statusFilter.value,category:categoryFilter.value,search:searchFilter.value.trim()});try{const result=await request(`api/freedom_wall/list_admin.php?${params}`);posts.replaceChildren();if(!result.data.length){posts.append(element('p','freedom-empty','No submissions match these filters.'));return}result.data.forEach(renderPost)}catch(error){posts.replaceChildren(element('p','freedom-empty',error.message));window.showAlert(error.message,'error')}}
      async function moderate(id,action,reason){try{csrfToken=csrfToken||(await request('api/csrf_token.php')).csrf_token;await request('api/freedom_wall/moderate.php',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrfToken},body:JSON.stringify({id,action,reason})});window.showAlert('Moderation action saved.','success');await loadPosts()}catch(error){window.showAlert(error.message,'error')}}
      statusFilter.addEventListener('change',loadPosts);categoryFilter.addEventListener('change',loadPosts);searchFilter.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(loadPosts,250)});refreshButton.addEventListener('click',loadPosts);
      updateDateTime();setInterval(updateDateTime,1000);loadProfile();loadPosts();
    })();
  </script>
</body>
</html>
